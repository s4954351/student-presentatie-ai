<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentatie-upload</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Upload je Presentatie</h1>
  </header>

  <main>
    <!-- ⬇︎ input-naam en id zijn nu allebei “file” -->
    <form id="uploadForm" enctype="multipart/form-data">
      <label for="file">Selecteer je video:</label>
      <input type="file" id="file" name="file" accept="video/*" required />
      <button type="submit">Uploaden</button>
    </form>

    <pre id="feedback"></pre> <!-- prettiger voor multi-line tekst -->
  </main>

  <script src="script.js"></script>
</body>
</html>
