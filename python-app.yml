name: Python application

on:               # wanneer draait de workflow?
  push:           # bij elke push
  pull_request:   # én elke Pull Request

jobs:
  build:
    runs-on: ubuntu-latest    # gratis Linux-runner

    steps:
    - uses: actions/checkout@v3      # 1. code binnenhalen

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'       # kies versie

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 backend

    - name: Run tests
      run: |
        pip install pytest
        pytest backend       # zoekt tests in backend/
